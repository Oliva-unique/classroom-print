<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>인쇄 · PDF 저장 — Unique English</title>
<style>
@font-face{font-family:Cookie;font-weight:700;font-display:block;src:url(fonts/cookie-700.woff2) format('woff2')}
@font-face{font-family:Cookie;font-weight:900;font-display:block;src:url(fonts/cookie-900.woff2) format('woff2')}
@font-face{font-family:NSR;font-weight:100 900;font-display:block;src:url(fonts/nsr.woff2) format('woff2')}
</style>
<style id="sheetCss"></style>
<style id="pageCss"></style>
<style>
html,body{margin:0}
body.pp{background:#eef1f4!important;font-family:NSR,sans-serif;color:#33264a}
body.pp:before{display:none!important}
#bar{position:sticky;top:0;z-index:10;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.08);padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
#bar .ttl{font-family:Cookie;font-weight:700;font-size:20px;flex:1;min-width:200px}
#bar .ttl small{display:block;font-family:NSR;font-weight:500;font-size:13px;color:#7a6f86;margin-top:3px}
#go{font-family:Cookie;font-weight:700;font-size:20px;border:0;border-radius:18px;padding:14px 26px;background:#00abc9;color:#fff;box-shadow:0 6px 0 #00809a;cursor:pointer}
#go:active{transform:translateY(4px);box-shadow:0 2px 0 #00809a}
#go:disabled{opacity:.5}
#tip{width:100%;font-size:14px;color:#5b5068;line-height:1.6;background:#fff8e1;border-radius:12px;padding:10px 14px}
#tip b{color:#33264a}
#msg{padding:60px 20px;text-align:center;font-family:Cookie;font-size:22px;color:#7a6f86}
body.pp > #printArea{display:flex!important;flex-direction:column;align-items:center;gap:22px;padding:26px 12px 60px}
body.pp > #printArea .sheet{background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.12);flex:none}
@media print{
  body.pp{background:#fff!important}
  #bar,#msg{display:none!important}
  body.pp > #printArea{display:block!important;padding:0;gap:0}
  body.pp > #printArea .sheet{box-shadow:none;margin:0}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body class="pp">
<div id="bar">
  <div class="ttl" id="ttl">인쇄 · PDF 저장<small>클래스룸에서 만든 시험지·단어 리스트</small></div>
  <button id="go" disabled>🖨️ 인쇄 · PDF로 저장</button>
  <div id="tip">💡 버튼을 누르면 인쇄 창이 떠요. <b>프린터로 바로 인쇄</b>하거나, 대상(프린터)을 <b>「PDF로 저장」</b>으로 바꾸면 PDF 파일로 저장돼요.
  용지 크기는 자동으로 맞춰져요. 여백은 <b>없음</b>, <b>배경 그래픽</b>은 켜 주세요.</div>
</div>
<div id="msg">불러오는 중…</div>
<div id="printArea"></div>
<script>
(async () => {
  const msg = document.getElementById('msg');
  try {
    const m = location.hash.match(/[#&]d=([^&]+)/);
    if (!m) throw new Error('nodata');
    const b64 = m[1].replace(/-/g, '+').replace(/_/g, '/');
    const bin = atob(b64 + '==='.slice((b64.length + 3) % 4));
    const bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    const data = JSON.parse(await new Response(stream).text());
    document.getElementById('sheetCss').textContent = data.css || '';
    const area = document.getElementById('printArea');
    area.innerHTML = data.html || '';
    if (data.title){ document.title = data.title; document.getElementById('ttl').innerHTML = ''; document.getElementById('ttl').append(data.title); const s = document.createElement('small'); s.textContent = '클래스룸에서 만든 시험지·단어 리스트'; document.getElementById('ttl').append(s); }
    await document.fonts.ready;
    const first = area.querySelector('.sheet');
    if (!first) throw new Error('nosheet');
    const mm = px => Math.round(px / 3.7795);
    const w = mm(first.offsetWidth), h = mm(first.offsetHeight);
    document.getElementById('pageCss').textContent = `@page{size:${w}mm ${h}mm;margin:0}`;
    msg.remove();
    const go = document.getElementById('go'); go.disabled = false;
    go.onclick = () => window.print();
  } catch(e){
    msg.textContent = '내용을 불러오지 못했어요. 클래스룸에서 「PDF로 저장」을 다시 눌러 주세요.';
  }
})();
</script>
</body>
</html>
